[package]
name = "ixcondidim"
version = "0.1.0"
edition = "2024"
authors = ["Lumen Pink <hi@lumen.pink>"]
description = "Filtro Milter Postfix em Rust para suporte a Autocrypt L1 server-side com gestão automática de chaves OpenPGP"
readme = "README.md"
repository = "https://codeberg.org/lumenpink/ixcondidim"
license = "Unlicense"
keywords = ["milter", "postfix", "autocrypt", "openpgp", "email-encryption"]
categories = ["email", "cryptography", "network-programming"]

[dependencies]
pgp = "0.20"
mail-parser = "0.11"
mail-builder = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
notify = "8.0"
rand = "0.8"
rand_chacha = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"

[dev-dependencies]
tempfile = "3.10"
