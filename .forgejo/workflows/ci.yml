name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: "Rust Test & Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: "Format Check"
        run: cargo fmt -- --check
      - name: "Clippy (Zero Warnings)"
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: "Run Tests"
        run: cargo test --all-targets --all-features

  release:
    name: "Release Linux x86_64 Binary"
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
      - name: "Build Release Binary"
        run: cargo build --release --bin ishcondidim

      - name: "Prune Previous Release on Forgejo"
        run: |
          API_URL="${GITHUB_API_URL:-https://gambi.2lp.in/api/v1}"
          REPO="${GITHUB_REPOSITORY:-lumen/ishcondidim}"
          TOKEN="${GITHUB_TOKEN:-${{ secrets.GITHUB_TOKEN }}}"
          REL_INFO=$(curl -s -H "Authorization: token $TOKEN" "$API_URL/repos/$REPO/releases/tags/latest" || true)
          REL_ID=$(echo "$REL_INFO" | jq -r .id 2>/dev/null || echo "")
          if [ -n "$REL_ID" ] && [ "$REL_ID" != "null" ]; then
            echo "Deletando release previa $REL_ID no Forgejo para recriacao atomica..."
            curl -s -X DELETE -H "Authorization: token $TOKEN" "$API_URL/repos/$REPO/releases/$REL_ID" || true
          fi

      - name: "Publish Sovereign Release (latest)"
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Ishcondidim Latest (linux-x86_64)"
          prerelease: false
          files: target/release/ishcondidim
          body: |
            Binário soberano oficial compilado para linux-x86_64.
            Commit: ${{ github.sha }}

