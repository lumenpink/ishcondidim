name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: "Rust Test & Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: "Format Check"
        run: cargo fmt -- --check
      - name: "Clippy (Zero Warnings)"
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: "Run Tests"
        run: cargo test --all-targets --all-features

  release:
    name: "Release Linux x86_64 Binary"
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
      - name: "Build Release Binary"
        run: cargo build --release --bin ishcondidim
      - name: "Publish Sovereign Release (latest)"
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Ishcondidim Latest (linux-x86_64)"
          prerelease: false
          files: target/release/ishcondidim
          body: |
            Binário soberano oficial compilado para linux-x86_64.
            Commit: ${{ github.sha }}

