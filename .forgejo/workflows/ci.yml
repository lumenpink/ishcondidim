name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: "Rust Test & Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: "Format Check"
        run: cargo fmt -- --check
      - name: "Clippy (Zero Warnings)"
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: "Run Tests"
        run: cargo test --all-targets --all-features

  deploy-banca:
    name: "Build & Publish Ishcondidim to Banca"
    runs-on: ubuntu-latest
    needs: [test]
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Determine Release Channel and Version"
        id: meta
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            CHANNEL="stable"
            VERSION="${REF#refs/tags/v}"
          else
            CHANNEL="nightly"
            BASE_VER=$(head -n 1 VERSION 2>/dev/null | cut -d'+' -f1 | tr -d ' \r\n' || echo "0.1.0-dev")
            GIT_SHA=$(git rev-parse --short HEAD)
            DATE_STAMP=$(date +%Y%m%d)
            VERSION="${BASE_VER}+${DATE_STAMP}.${GIT_SHA}"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "★ Canal: $CHANNEL | Versão: $VERSION"

      - name: "Compile Ishcondidim Static Binary"
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          echo "★ Compilando x86_64-unknown-linux-musl (Linux AMD64)..."
          cargo zigbuild --release --target x86_64-unknown-linux-musl --bin ishcondidim || \
            cargo build --release --target x86_64-unknown-linux-musl --bin ishcondidim

      - name: "Package Artifacts & Generate Checksums"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist/packages

          BIN_PATH=""
          if [ -f target/x86_64-unknown-linux-musl/release/ishcondidim ]; then
            BIN_PATH="target/x86_64-unknown-linux-musl/release/ishcondidim"
          elif [ -f target/release/ishcondidim ]; then
            BIN_PATH="target/release/ishcondidim"
          fi

          if [ -n "$BIN_PATH" ]; then
            cp "$BIN_PATH" "dist/packages/ishcondidim-${VERSION}-linux-x86_64"
            tar -czf "dist/packages/ishcondidim-${VERSION}-linux-amd64.tar.gz" \
              -C "$(dirname "$BIN_PATH")" ishcondidim \
              -C "$PWD" README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/ishcondidim-${VERSION}-linux-amd64.tar.gz" \
              -C "$(dirname "$BIN_PATH")" ishcondidim
          fi

          cd dist/packages
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd "$GITHUB_WORKSPACE"

      - name: "Upload Artifacts to Cloudflare R2"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          VERSION="${{ steps.meta.outputs.version }}"

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando upload R2."
            exit 0
          fi

          echo "★ Enviando pacotes para o Cloudflare R2 (twolp-bucket / bucket.2lp.in)..."
          for PKG in dist/packages/*; do
            [ -f "$PKG" ] || continue
            PKG_NAME=$(basename "$PKG")
            npx wrangler r2 object put "twolp-bucket/downloads/ishcondidim/${CHANNEL}/${PKG_NAME}" \
              --file="$PKG" --remote || true
          done

      - name: "Rotate Manifest & Commit to Banca"
        env:
          GIT_2LP_TOKEN: ${{ secrets.GIT_2LP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          VERSION="${{ steps.meta.outputs.version }}"

          echo "★ Clonando repositório soberano da Banca para rotação e retenção..."
          git clone --depth 1 "https://lumen:${GIT_2LP_TOKEN}@gambi.2lp.in/lumen/banca.git" /tmp/banca

          if [ -d "/tmp/banca/site/downloads/ishcondidim" ] && [ -f "/tmp/banca/scripts/rotate-downloads.py" ]; then
            cd /tmp/banca

            PKG_FILE="ishcondidim-${VERSION}-linux-amd64.tar.gz"
            HASH=$(grep "$PKG_FILE" "$GITHUB_WORKSPACE/dist/packages/SHA256SUMS" | awk '{print $1}' || echo "")
            DOWNLOAD_URL="https://banca.2lp.in/downloads/ishcondidim/${CHANNEL}/${PKG_FILE}"

            python3 scripts/rotate-downloads.py \
              --manifest site/downloads/ishcondidim/index.json \
              --channel "${CHANNEL}" \
              --arch "linux-amd64" \
              --version-str "${VERSION}" \
              --url "${DOWNLOAD_URL}" \
              --sha256 "${HASH}" \
              --tarball "${PKG_FILE}" \
              --app "ishcondidim"

            git config user.name "Ishcondidim Release Bot"
            git config user.email "bot@2lp.in"
            git add site/downloads/ishcondidim/index.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(downloads): rotate ishcondidim release to ${VERSION} (#3)"
              git push origin main || echo "Aviso: Push do manifesto na Banca falhou."
            else
              echo "Manifesto já estava atualizado."
            fi
            cd "$GITHUB_WORKSPACE"
          fi
